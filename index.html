<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectX Ultra - منصة المراسلة المتقدمة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- شريط التنقل الجانبي -->
    <nav class="app-nav">
      <div class="nav-brand"><i class="fa-solid fa-bolt"></i></div>
      <button class="nav-btn active" data-tab="chats" title="المحادثات"><i class="fa-solid fa-comment-dots"></i></button>
      <button class="nav-btn" data-tab="stories" title="الحالات"><i class="fa-solid fa-circle-notch"></i></button>
      <button class="nav-btn" data-tab="ai" title="المساعد الذكي"><i class="fa-solid fa-robot"></i></button>
      <div class="nav-divider"></div>
      <button class="nav-btn" id="stealth-toggle-btn" title="وضع التخفي (Stealth)"><i class="fa-solid fa-user-ninja"></i></button>
    </nav>

    <!-- الشريط الجانبي للمحتوى -->
    <aside class="sidebar">
      <!-- قسم المحادثات -->
      <section id="tab-chats" class="tab-content active">
        <header class="sidebar-header">
          <h2>المحادثات</h2>
          <button id="sync-contacts-btn" class="btn-icon" title="مزامنة جهات الاتصال"><i class="fa-solid fa-user-plus"></i></button>
        </header>

        <!-- تصنيف المجلدات الذكية -->
        <div class="folder-pills">
          <button class="pill active" data-filter="all">الكل</button>
          <button class="pill" data-filter="personal">شخصي</button>
          <button class="pill" data-filter="work">العمل</button>
          <button class="pill" data-filter="saved"><i class="fa-solid fa-bookmark"></i> المحفوظات</button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="بحث أو تصفية حسب النوع...">
        </div>
        <ul class="contacts-list" id="contacts-list"></ul>
      </section>

      <!-- قسم الحالات (Stories) -->
      <section id="tab-stories" class="tab-content">
        <header class="sidebar-header">
          <h2>الحالات</h2>
          <label for="story-input" class="btn-icon" title="إضافة حالة"><i class="fa-solid fa-plus"></i></label>
          <input type="file" id="story-input" accept="image/*,video/*" hidden>
        </header>
        <div class="stories-list" id="stories-list"></div>
      </section>

      <!-- قسم المساعد الذكي -->
      <section id="tab-ai" class="tab-content">
        <header class="sidebar-header">
          <h2>ConnectAI الذكي</h2>
        </header>
        <div class="ai-info-card">
          <i class="fa-solid fa-brain"></i>
          <p>يمكنك طلب تلخيص المحادثات، ترجمة النصوص، أو الإجابة على استفساراتك فورياً.</p>
        </div>
      </section>
    </aside>

    <!-- منطقة الشاشة الرئيسية -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-user-info">
          <img src="https://via.placeholder.com/40" id="active-avatar" class="avatar" alt="">
          <div>
            <h3 id="active-name">اختر محادثة لبدء التواصل</h3>
            <span id="active-status" class="status-indicator"></span>
          </div>
        </div>
        <div class="chat-actions">
          <button id="call-audio-btn" class="btn-icon" title="مكالمة صوتية"><i class="fa-solid fa-phone"></i></button>
          <button id="call-video-btn" class="btn-icon" title="مكالمة فيديو"><i class="fa-solid fa-video"></i></button>
          <button id="toggle-lock-btn" class="btn-icon" title="قفل المحادثة"><i class="fa-solid fa-lock"></i></button>
          <button id="toggle-media-panel" class="btn-icon" title="معرض الوسائط"><i class="fa-solid fa-folder-open"></i></button>
        </div>
      </header>

      <!-- حاوية الرسائل -->
      <div class="messages-container" id="messages-container"></div>

      <!-- قائمة الردود السريعة (تظهر عند النقر أو كتابة /) -->
      <div id="quick-replies-menu" class="quick-replies-menu hidden">
        <button class="qr-item" data-text="أهلاً بك! كيف يمكنني مساعدتك اليوم؟">👋 أهلاً بك!</button>
        <button class="qr-item" data-text="أنا في اجتماع حالياً، سأتصل بك لاحقاً.">📅 في اجتماع</button>
        <button class="qr-item" data-text="تم استلام الملف وجاري المراجعة.">👍 تم الاستلام</button>
      </div>

      <!-- مؤشر الكتابة -->
      <div id="typing-indicator" class="typing-indicator hidden">جاري الكتابة...</div>

      <!-- شريط الإدخال والتحكم المتقدم -->
      <footer class="chat-input-area">
        <label for="file-input" class="btn-icon" title="إرفاق ملف"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="file-input" accept="image/*,video/*" hidden>

        <!-- زر العرض لمرة واحدة -->
        <button id="view-once-btn" class="btn-icon" title="عرض لمرة واحدة (View Once)"><i class="fa-solid fa-1"></i></button>
        
        <!-- زر الردود السريعة -->
        <button id="quick-reply-btn" class="btn-icon" title="ردود سريعة"><i class="fa-solid fa-bolt-lightning"></i></button>

        <input type="text" id="message-input" placeholder="اكتب رسالتك أو اكتب / للردود السريعة..." autocomplete="off">
        
        <!-- تحويل الصوت إلى نص -->
        <button id="stt-btn" class="btn-icon" title="تحويل الكلام لنص"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        
        <!-- جدولة الرسائل -->
        <button id="schedule-btn" class="btn-icon" title="جدولة الرسالة"><i class="fa-solid fa-clock"></i></button>

        <button id="record-audio-btn" class="btn-icon" title="تسجيل صوتي"><i class="fa-solid fa-microphone"></i></button>
        <button id="send-btn" class="btn-send" title="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
      </footer>
    </main>

    <!-- معرض الوسائط المشتركة -->
    <aside class="media-gallery-panel hidden" id="media-panel">
      <header class="sidebar-header">
        <h3>الوسائط المشتركة</h3>
        <button id="close-media-panel" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="media-grid" id="media-grid"></div>
    </aside>
  </div>

  <!-- Modal: قفل المحادثة برمز PIN -->
  <div id="pin-modal" class="modal hidden">
    <div class="modal-card">
      <i class="fa-solid fa-shield-halved modal-icon"></i>
      <h3>المحادثة محمية</h3>
      <p>أدخل رمز PIN المكون من 4 أرقام للفتح:</p>
      <input type="password" id="pin-input" maxlength="4" placeholder="****">
      <button id="unlock-pin-btn" class="btn-primary">تأكيد الفتح</button>
    </div>
  </div>

  <!-- Modal: جدولة الرسالة -->
  <div id="schedule-modal" class="modal hidden">
    <div class="modal-card">
      <i class="fa-solid fa-calendar-plus modal-icon"></i>
      <h3>جدولة إرسال الرسالة</h3>
      <input type="datetime-local" id="schedule-time-input">
      <div class="modal-actions">
        <button id="confirm-schedule-btn" class="btn-primary">جدولة الآن</button>
        <button id="close-schedule-btn" class="btn-secondary">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- واجهة مكالمات WebRTC -->
  <div id="call-modal" class="call-modal hidden">
    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted class="local-video"></video>
      <div class="call-controls">
        <button id="end-call-btn" class="btn-call-end"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
